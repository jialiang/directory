<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jia Liang's Projects</title>
    <meta
      name="description"
      content="Every public GitHub repository and gist by Jia Liang."
    />
    <link rel="canonical" href="https://jialiang.github.io/directory/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      @font-face {
        font-style: normal;
        font-weight: 400;
        src:
          url("./fonts/noto-sans-jp-regular.woff2") format("woff2"),
          url("./fonts/noto-sans-jp-regular.woff") format("woff");
        font-family: "Noto Sans JP";
        font-display: swap;
      }

      @font-face {
        font-style: normal;
        font-weight: 700;
        src:
          url("./fonts/noto-sans-jp-bold.woff2") format("woff2"),
          url("./fonts/noto-sans-jp-bold.woff") format("woff");
        font-family: "Noto Sans JP";
        font-display: swap;
      }

      body {
        max-width: 650px;
        margin: 40px auto;
        padding: 0 10px;
        font:
          18px/1.5 "Noto Sans JP",
          sans-serif;
        color: #c9d1d9;
        background: #0d1117;
      }

      h1,
      h2,
      h3 {
        line-height: 1.2;
      }

      a {
        color: #58a6ff;
      }

      li {
        margin-bottom: 1rem;
      }

      li small {
        color: #8b949e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jia Liang's Projects</h1>
      <p>
        Every public GitHub repository and gist by Jia Liang. More on
        <a href="https://github.com/jialiang">GitHub</a>.
      </p>

      <h2>Repositories</h2>
      <ul>
        {{repos}}
      </ul>

      <h2>Gists</h2>
      <ul>
        {{gists}}
      </ul>

      <h2>Forks</h2>
      <ul>
        {{forks}}
      </ul>
    </main>
  </body>
</html>
