name: deploy to gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt

      - name: Fetch repos and gists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          mkdir -p data
          gh api --paginate --slurp "users/jialiang/repos?per_page=100" > data/repos.json

          # The Actions token can't read gists. Going unauthenticated instead shares
          # the runner IP's rate limit, so a no-permission personal token stands in.
          GH_TOKEN="$GIST_TOKEN" gh api --paginate --slurp "users/jialiang/gists?per_page=100" \
            > data/gists.json

      - name: Build webpage
        run: node build.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
